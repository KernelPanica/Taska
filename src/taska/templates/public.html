{% load static i18n %}{% get_current_language as LANGUAGE_CODE %}
<!doctype html><html lang="{{ LANGUAGE_CODE }}" data-theme="dark"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="color-scheme" content="dark"><title>Taska</title><link rel="stylesheet" href="{% static 'css/style.css' %}"></head><body class="public-page"><main id="main" class="panel public-panel"><span class="brand">Taska</span><form class="language-switcher" action="{% url 'set_language' %}" method="post">{% csrf_token %}<input type="hidden" name="next" value="{{ request.path }}"><button name="language" value="en" lang="en">EN</button><button name="language" value="ru" lang="ru">RU</button></form>{% block content %}{% endblock %}</main></body></html>
