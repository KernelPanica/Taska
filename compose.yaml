# Локальный запуск одной командой: docker compose up --build → http://localhost:3000
# Профиль development: заглушка YourSpace и тестовые данные включены. Для production — compose.prod.yaml.
services:
  yourtask:
    build: .
    environment:
      YOURTASK_PROFILE: development
      YOURTASK_PUBLIC_URL: http://localhost:3000
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - yourtask-dev-data:/data

volumes:
  yourtask-dev-data:
