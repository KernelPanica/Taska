name: Checks
on: [push, pull_request]
jobs:
  checkpoint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: ruff check . && ruff format --check .
      - run: python manage.py makemigrations --check --dry-run --settings=taska.test_settings
      - run: python manage.py test taska.todos taska.projects --settings=taska.test_settings
      - run: PYTHONPATH=src python tests/check_persistence.py
      - run: python -m playwright install --with-deps chromium
      - run: RUN_BROWSER=1 python manage.py test tests.browser --settings=taska.test_settings
