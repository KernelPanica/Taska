# Автопроверки на каждое изменение кода (docs/adr/0007): формат, линтер, типы, тесты, сборка, e2e.
name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Formatting
        run: npm run format:check
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Unit and API tests
        run: npm test
      - name: Build
        run: npm run build
      - name: Migrations apply to a clean database twice
        run: |
          export YOURTASK_DATABASE_PATH="$RUNNER_TEMP/ci.db"
          npm run db:migrate
          npm run db:migrate

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
        env:
          CI: "true"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Image builds and starts healthy
        run: |
          docker compose up --build -d
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:3000/health && exit 0; sleep 2; done
          docker compose logs
          exit 1
